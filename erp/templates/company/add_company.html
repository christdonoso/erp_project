{% extends 'base_templates/base.html' %}

{% block content %}
			<main class="content">
				<div class="container-fluid p-0">


					<div class="row">
						<div class="col-12">
							<div class="card">
                                					{% if messages %}
						<div class="container mt-3">
							{% for message in messages %}
										<div class="alert alert-{{ message.tags }} alert-dismissible" role="alert">
											<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
											<div class="alert-message">
												 {{ message }}
											</div>
										</div>
							{% endfor %}
						</div>
					{% endif %}

								<div class="card-body">
                                    <div class="card-header bg-primary text-white d-flex align-items-center">
                                        <i class="fas fa-building me-2"></i>
                                        <h5 class="mb-0 text-white">Registrar Nueva Empresa</h5>
                                    </div>
                                <form method="POST" action="{% url 'add_company' %}" enctype="multipart/form-data" class="mt-4">
                                    {% csrf_token %}

                                    <div class="card shadow-sm border-0 rounded-3">


                                        <div class="card-body">

                                            <!-- Datos principales -->
                                            <h6 class="text-primary mb-3"><i class="fas fa-id-card me-1"></i> Información General</h6>
                                            <div class="row">
                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label" for="name">Nombre de la Empresa</label>
                                                    <input type="text" class="form-control" id="name" name="name" value="{{ company.name|default:'' }}" placeholder="Ej: SICA SPA" required>
                                                </div>
                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label" for="rut">RUT</label>
                                                    <input type="text" class="form-control" id="rut" name="rut" value="{{ company.rut|default:'' }}" placeholder="Ej: 77.123.456-7" required>
                                                </div>
                                            </div>

                                            <!-- Contacto -->
                                            <h6 class="text-primary mb-3 mt-4"><i class="fas fa-envelope me-1"></i> Información de Contacto</h6>
                                            <div class="row">
                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label" for="email">Correo Electrónico</label>
                                                    <input type="email" class="form-control" id="email" name="email" value="{{ company.email|default:'' }}" placeholder="empresa@correo.com">
                                                </div>
                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label" for="phone">Teléfono</label>
                                                    <input type="text" class="form-control" id="phone" name="phone" value="{{ company.phone|default:'' }}" placeholder="+56 9 1234 5678">
                                                </div>
                                            </div>

                                            <!-- Ubicación -->
                                            <h6 class="text-primary mb-3 mt-4"><i class="fas fa-map-marker-alt me-1"></i> Ubicación</h6>
                                            <div class="mb-3">
                                                <label class="form-label" for="address">Dirección</label>
                                                <input type="text" class="form-control" id="address" name="address" value="{{ company.address|default:'' }}" placeholder="Ej: Av. Las Condes 1234, Santiago">
                                            </div>

                                            <!-- Detalles -->
                                            <h6 class="text-primary mb-3 mt-4"><i class="fas fa-info-circle me-1"></i> Detalles</h6>
                                            <div class="mb-3">
                                                <label class="form-label" for="description">Descripción</label>
                                                <textarea class="form-control" id="description" name="description" rows="3" placeholder="Describe brevemente la empresa...">{{ company.description|default:'' }}</textarea>
                                            </div>

                                            <div class="row">
                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label" for="website">Sitio Web</label>
                                                    <input type="url" class="form-control" id="website" name="website" value="{{ company.website|default:'' }}" placeholder="https://www.miempresa.cl">
                                                </div>
                                                <div class="col-md-6 mb-3">
                                                    <label class="form-label" for="logo">Logo de la Empresa</label>
                                                    <input type="file" class="form-control" id="logo" name="" accept="image/*">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="card-footer text-end bg-light">
                                            <button type="submit" class="btn btn-primary px-4">
                                                <i class="fas fa-save me-1"></i> Crear Empresa
                                            </button>
                                        </div>
                                    </div>
                                </form>
                                <script>
                                const form = document.querySelector('form');
                                const btnText = document.getElementById('btnText');
                                const btnLoading = document.getElementById('btnLoading');
                                form.addEventListener('submit', () => {
                                    btnText.classList.add('d-none');
                                    btnLoading.classList.remove('d-none');
                                });
                                </script>
								</div>
							</div>
						</div>
					</div>
					
				</div>
			</main>
    
{% endblock %}
